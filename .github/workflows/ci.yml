name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Test the Dockerfile from this commit, without depending on a prebuilt
      # shared image or registry publishing permissions.
      - name: Build test environment
        run: docker build -t el-klock-ci .
      - name: Build, test and lint
        run: docker run --rm -v "$PWD:/src" -w /src el-klock-ci bash tools/ci-check.sh
