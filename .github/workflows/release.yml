name: Build release packages

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'tools/build-release.py'
      - 'packaging/**'
      - 'tests/test_release.py'
      - 'package/**'
      - 'translate/**'
      - 'LICENSE*'
      - 'NOTICE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext rpm dpkg-dev file
      - name: Verify package contents and version guard
        run: python3 -m unittest discover -s tests -p test_release.py
      - name: Build release files
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          args=()
          if [[ -n "$RELEASE_TAG" ]]; then args+=(--tag "$RELEASE_TAG"); fi
          python3 tools/build-release.py "${args[@]}"
          cd dist
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: elklock-packages
          path: dist/*
          if-no-files-found: error

  release:
    needs: packages
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: elklock-packages
          path: dist
      - name: Create release and attach packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" --verify-tag --title "EL-Klock $RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" dist/* --clobber
